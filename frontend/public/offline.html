<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aurral is offline</title>
    <style>
      :root {
        color-scheme: light dark;
        --ink: #1b1b1b;
        --muted: #5f6368;
        --ground: #f6f6f7;
        --card: #ffffff;
        --line: #dcdcdf;
        --accent: #3d7ee5;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #f2f2f3;
          --muted: #a0a3a8;
          --ground: #101114;
          --card: #191b1f;
          --line: #2c2f35;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--ground);
        color: var(--ink);
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .card {
        width: 100%;
        max-width: 380px;
        padding: 32px 28px;
        text-align: center;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 16px;
      }
      h1 {
        margin: 18px 0 8px;
        font-size: 19px;
        font-weight: 600;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
      }
      button {
        margin-top: 22px;
        width: 100%;
        padding: 11px 16px;
        font: inherit;
        font-weight: 600;
        font-size: 14px;
        color: #fff;
        background: var(--accent);
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }
      button:hover {
        filter: brightness(1.07);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="icons/aurral-192.png" alt="" />
      <h1>Can't reach your music</h1>
      <p>Aurral is not answering right now. Check that you are online, then try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
